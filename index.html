<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Locked - See You Next Year</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: not-allowed;
        }

        /* Blurry background effect */
        .blur-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="%232563eb" opacity="0.1"/></svg>');
            background-size: 200px 200px;
            filter: blur(20px);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px 20px;
        }

        .locked-icon {
            font-size: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
        }

        h1 {
            font-size: 3.5em;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5),
                         0 0 60px rgba(37, 99, 235, 0.5),
                         0 0 90px rgba(37, 99, 235, 0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.5),
                             0 0 40px rgba(37, 99, 235, 0.5),
                             0 0 60px rgba(37, 99, 235, 0.3);
            }
            to {
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.8),
                             0 0 60px rgba(37, 99, 235, 0.8),
                             0 0 90px rgba(37, 99, 235, 0.5);
            }
        }

        .subtitle {
            font-size: 1.8em;
            font-weight: 700;
            color: #60a5fa;
            margin-bottom: 30px;
            letter-spacing: 3px;
        }

        .year-badge {
            display: inline-block;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.5em;
            font-weight: 700;
            margin: 20px 0;
            box-shadow: 0 10px 40px rgba(37, 99, 235, 0.4);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .good-luck {
            font-size: 4em;
            font-weight: 900;
            background: linear-gradient(135deg, #fbbf24, #f59e0b, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 30px 0;
            letter-spacing: 10px;
            text-transform: uppercase;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            0% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
            100% { filter: brightness(1); }
        }

        .message {
            color: #94a3b8;
            font-size: 1.1em;
            margin-top: 40px;
            max-width: 500px;
            line-height: 1.8;
        }

        .lock-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 5;
            pointer-events: none;
        }

        /* Disable all interactions */
        body, body * {
            pointer-events: none !important;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2em; letter-spacing: 4px; }
            .subtitle { font-size: 1.2em; }
            .good-luck { font-size: 2.5em; letter-spacing: 5px; }
            .year-badge { font-size: 1.1em; padding: 12px 30px; }
        }
    </style>
</head>
<body>
    <div class="blur-bg"></div>
    <div class="lock-overlay"></div>

    <div class="container">
        <div class="locked-icon">🔒</div>
        <h1>Exam Locked</h1>
        <p class="subtitle">This content is secured for next year</p>

        <div class="year-badge">📅 2027</div>

        <div class="good-luck">⭐ GOOD LUCK ⭐</div>

        <p class="message">
            All study materials have been locked.<br>
            Come back prepared for the next exam cycle.<br>
            <strong>Wishing you the best of luck!</strong>
        </p>
    </div>

    <script>
        // Disable all keyboard shortcuts and interactions
        document.addEventListener('keydown', function(e) {
            e.preventDefault();
            e.stopPropagation();
        }, true);

        document.addEventListener('keyup', function(e) {
            e.preventDefault();
            e.stopPropagation();
        }, true);

        document.addEventListener('mousedown', function(e) {
            e.preventDefault();
            e.stopPropagation();
        }, true);

        document.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
        }, true);

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            e.stopPropagation();
        }, true);

        // Disable selection
        document.addEventListener('selectstart', function(e) {
            e.preventDefault();
        }, true);

        console.log('%c🔒 EXAM LOCKED - See you in 2027!', 'font-size: 20px; color: #ef4444; font-weight: bold;');
        console.log('%c⭐ GOOD LUCK! ⭐', 'font-size: 16px; color: #fbbf24; font-weight: bold;');
    </script>
</body>
</html>
