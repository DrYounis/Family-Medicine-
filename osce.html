<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Younis OSCE Study Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --accent: #059669; --roleplay: #dc2626; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; border-bottom: 2px solid var(--primary); padding-bottom: 20px; position: sticky; top: 0; background: var(--bg); z-index: 100; }
        .nav-links { margin-top: 15px; }
        .nav-links a { margin: 0 10px; padding: 8px 16px; background: var(--primary); color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }
        .nav-links a:hover { background: #1d4ed8; }
        .category-tab { display: inline-block; padding: 4px 12px; background: #e2e8f0; color: #475569; border-radius: 6px; font-size: 0.8em; font-weight: 700; margin-bottom: 10px; text-transform: uppercase; }
        .roleplay-tab { background: #fecaca; color: #991b1b; }
        .checklist-card { background: var(--card); border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-left: 5px solid var(--primary); }
        .checklist-card.roleplay { border-left-color: var(--roleplay); }
        .question-text { font-weight: 600; font-size: 1.1em; margin-bottom: 15px; }
        .answer-box { background: #f0fdf4; color: var(--accent); padding: 15px; border-radius: 8px; font-weight: 700; margin-top: 10px; display: none; border: 1px solid #bbf7d0; }
        .roleplay-box { background: #fef2f2; color: #991b1b; padding: 15px; border-radius: 8px; margin-top: 10px; display: none; border: 1px solid #fecaca; }
        .checklist-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .checklist-table th, .checklist-table td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .checklist-table th { background: #f1f5f9; font-weight: 600; }
        .good-col { color: var(--accent); }
        .poor-col { color: #dc2626; }
        .btn { cursor: pointer; background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; transition: 0.2s; }
        .btn-sec { background: #e2e8f0; color: #1e293b; border: none; padding: 5px 15px; border-radius: 5px; font-size: 0.8em; margin-top: 10px; margin-right: 5px; }
        .btn-roleplay { background: #dc2626; color: white; }
        @media print { .btn, .btn-sec { display: none; } .answer-box, .roleplay-box { display: block !important; } .checklist-card { break-inside: avoid; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏥 Dr. Younis OSCE Flashcards 2026</h1>
        <p>Suez Canal University · Faculty of Medicine · Family Medicine Department</p>
        <p>Total Cards: <span id="qcount"></span> | Updated: March 19, 2026</p>
        <div class="nav-links">
            <a href="index.html">← MCQs Practice</a>
            <a href="#" onclick="toggleAllAnswers(); return false;">Show All Answers</a>
        </div>
    </header>

    <div id="quiz-container"></div>
</div>

<script>
    const questionBank = [
        // ROLE PLAYER CARDS
        { 
            cat: "Role Player", 
            type: "roleplay",
            cardNum: "00",
            q: "GERD Case — Role Player Information", 
            patientName: "Ibtisam Muhammad Ahmed",
            age: "45 years old",
            background: "Math teacher, married, 2 daughters (18 & 16 yrs), non-smoker",
            chiefComplaint: "Heartburn & chest burning for ~6 months",
            history: [
                "Gastric acidity & chest burning for 6 months; started as 1–2x/week after fatty meals",
                "Now daily for the past month",
                "On treatment for 2 months: Pantoprazole 20mg + Jestramole 14 capsules/day — currently relieving symptoms temporarily",
                "Takes medication 30 min before meals, daily",
                "Burning was previously associated only with pregnancy",
                "No nausea, vomiting, difficulty swallowing, abdominal pain, diarrhea, constipation, blood in stool, or weight loss",
                "Symptoms worsen with exercise or bending; sometimes associated with acid taste in mouth; sometimes lies on back",
                "Does not like spicy food; drinks fizzy water irregularly; drinks coffee as a daily staple; eats fast food occasionally",
                "No HTN, DM, chest allergy, chest/liver disease, or tumors in PMH/FH",
                "No long-term medications prior; no previous surgeries",
                "Condition does not affect sleep, work, or mood — الحمد لله"
            ]
        },

        // CHECKLIST CARDS
        {
            cat: "GERD",
            type: "checklist",
            cardNum: "01",
            q: "GERD — History Taking & Management",
            good: [
                "Differentiates GERD from other causes of dyspepsia",
                "Enquires about aggravating factors",
                "Assesses red flags and asks about atypical presentations of GERD",
                "Decides continuation of medical treatment (without endoscopy referral)",
                "Elicits patient's ideas, concerns, and expectations (ICE) and responds appropriately",
                "Provides health education: explains the condition, risk factor avoidance, lifestyle modification, correct medication use",
                "Revises and comments on medications: anti-secretory drugs (PPI) for healing of esophagitis",
                "Refers patient for endoscopy with explanation",
                "Informs patient of the date of follow-up"
            ],
            poor: [
                "Obtains unsystematic history with too much irrelevant information",
                "Does not enquire about red flags"
            ]
        },

        {
            cat: "Clinical Skills",
            type: "checklist",
            cardNum: "02",
            q: "Cranial Nerve Examination",
            good: [
                "Builds rapport and uses appropriate communication skills",
                "Takes permission to conduct facial examination",
                "Properly explains examination steps and expected responses to patient",
                "Performs hand hygiene (alcohol rub) before and after",
                "Conducts cranial nerve examination fluently: inspection of both sides of face, neck, and shoulders, then specific tests per nerve",
                "Explains findings to the assessor"
            ],
            poor: [
                "Proceeds with examination without taking permission",
                "Ignores infection control measures",
                "Provides no explanation to patient about examination steps",
                "Conducts cranial nerve examination unsystematically (hesitation, blocking, etc.)"
            ]
        },

        {
            cat: "Pediatrics",
            type: "checklist",
            cardNum: "03",
            q: "Pediatric COVID-19 — History & Management",
            good: [
                "Establishes rapport and uses communication skills appropriately",
                "Asks about presenting complaint with analysis of associated symptoms",
                "Inquires about other systems: GIT, urinary, and cardiac",
                "Inquires about past history of similar attacks and hospitalizations",
                "Interprets examination properly",
                "Elicits parent's ideas, concerns, and expectations (ICE)",
                "Orders investigations: CBC, pulse oximetry, D-dimer, ESR, CRP, S-ferritin, CT chest",
                "Advises strict home isolation, use of PPE, warns about red flags; no antibiotics",
                "Prescribes: Vitamin C 1g daily, Zinc 50mg daily, Acetylcysteine 200mg/8h, Lactoferrin 1 sachet/12h",
                "Asks parent about any questions",
                "Informs parent about date of follow-up"
            ],
            poor: [
                "Reacts inappropriately with parent (emotionless or aggressive)",
                "Obtains unsystematic history with too much irrelevant information",
                "Does not differentiate between COVID and non-COVID illnesses",
                "Does not order relevant investigations",
                "Does not treat patient properly",
                "Does not elicit ideas, concerns, and expectations of the patient/parent"
            ]
        },

        {
            cat: "Internal Med",
            type: "checklist",
            cardNum: "04",
            q: "Renal/Ureteric Stone — History & Management",
            good: [
                "Establishes rapport and uses communication skills appropriately",
                "Analyses pain: character, radiation, exacerbating/alleviating factors; asks about passage of stone with micturition",
                "Inquires about warning symptoms: fever, hematuria, anuria",
                "Asks about suprapubic pain and LUTS: frequency, urgency, nocturia, incomplete emptying, hesitancy, poor stream, straining, terminal dribbling",
                "Inquires about predisposing factors: fluid/dietary habits, bowel disease, gout, family/past history of renal stones",
                "Assesses drug history: current use, drug allergy, contraindications to NSAIDs (e.g. PUD)",
                "Reviews investigations",
                "Elicits ICE and effect on daily life",
                "Attempts examination with permission and infection control",
                "Breaks diagnosis appropriately; informs patient stone will likely pass spontaneously",
                "Educates: ≥2L water/day, avoid high-purine foods, limit sweet fruit juices/sugar/salt, strain urine, bring any passed stone for analysis; weight reduction if obese",
                "Prescribes NSAIDs or opioids (appropriate form, dose, frequency, duration)",
                "Prescribes gout prevention if needed: Allopurinol or Febuxostat",
                "Prescribes urine alkalinizing agent: Potassium citrate/bicarbonate",
                "Asks patient for any questions; informs about follow-up (7–14 days)"
            ],
            poor: [
                "Does not rule out pyelonephritis, gross hematuria, or decreased urinary output",
                "Does not exclude: UTI, renal mass, prostatitis, obstructed inguinal hernia, musculoskeletal inflammation",
                "Does not inquire about risk factors for ureteric stone (fluid/dietary habits, gout, family history, past history)",
                "Ignores eliciting ICE of patient",
                "Tells patient stone will need SWL, ureteroscopy (URS), or surgery",
                "Refers patient to urologist (not managing conservatively)",
                "Prescribes acidification agents for urine",
                "Does not educate about increased water intake, decreased salt intake, or straining urine"
            ]
        }
    ];

    function renderQuiz() {
        document.getElementById('qcount').innerText = questionBank.length;
        const container = document.getElementById('quiz-container');
        container.innerHTML = questionBank.map((item, index) => {
            if (item.type === 'roleplay') {
                return `
                    <div class="checklist-card roleplay">
                        <span class="category-tab roleplay-tab">🎭 Role Player Card ${item.cardNum}</span>
                        <div class="question-text">${item.q}</div>
                        <button class="btn-sec btn-roleplay" onclick="toggleRoleplay(${index})">Show Patient Info</button>
                        <div id="role-${index}" class="roleplay-box">
                            <p><strong>Patient Name:</strong> ${item.patientName}</p>
                            <p><strong>Age:</strong> ${item.age}</p>
                            <p><strong>Background:</strong> ${item.background}</p>
                            <p><strong>Chief Complaint:</strong> ${item.chiefComplaint}</p>
                            <hr style="border: 1px solid #fecaca; margin: 15px 0;">
                            <p><strong>Key History Points (reveal only if asked):</strong></p>
                            <ul>
                                ${item.history.map(point => `<li>${point}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                `;
            } else if (item.type === 'checklist') {
                return `
                    <div class="checklist-card">
                        <span class="category-tab">${item.cat} · Card ${item.cardNum}</span>
                        <div class="question-text">${item.q}</div>
                        <button class="btn-sec" onclick="toggleChecklist(${index})">Show Checklist</button>
                        <div id="check-${index}" class="answer-box" style="display:none;">
                            <table class="checklist-table">
                                <thead>
                                    <tr>
                                        <th class="good-col">✅ GOOD PERFORMANCE</th>
                                        <th class="poor-col">❌ POOR PERFORMANCE</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>
                                            <ul>
                                                ${item.good.map(point => `<li>${point}</li>`).join('')}
                                            </ul>
                                        </td>
                                        <td>
                                            <ul>
                                                ${item.poor.map(point => `<li>${point}</li>`).join('')}
                                            </ul>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }
        }).join('');
    }

    function toggleRoleplay(id) {
        const box = document.getElementById(`role-${id}`);
        box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    }

    function toggleChecklist(id) {
        const box = document.getElementById(`check-${id}`);
        box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    }

    function toggleAllAnswers() {
        const roleplayBoxes = document.querySelectorAll('.roleplay-box');
        const checklistBoxes = document.querySelectorAll('.answer-box');
        roleplayBoxes.forEach(box => box.style.display = 'block');
        checklistBoxes.forEach(box => box.style.display = 'block');
    }

    renderQuiz();
</script>

</body>
</html>
